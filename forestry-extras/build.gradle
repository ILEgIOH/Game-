plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = mod_group
version = mod_version
base.archivesName = "${mod_id}-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Forestry's public API (LGPL, see forestry-api/forestry/api/LICENSE.txt) from the alpha8 tag.
// Compile-time only: the real classes come from the installed Forestry mod.
sourceSets {
    forestryApi {
        java.srcDir 'forestry-api'
    }
}

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.forestryApi)
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'extrabees.selftest', providers.gradleProperty('selftest').getOrElse('false')
            gameDirectory = file('run/server')
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

processResources {
    var props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                 forestry_version: forestry_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}


dependencies {
    compileOnly sourceSets.forestryApi.output
}
